  rfc: RFC 8414
  status: 200
  probed: '2026-09-14'
  file: well-known/authologic-sandbox-oauth-authorization-server.json
  issuer: https://sandbox.authologic.com
  endpoints:
    authorization: https://sandbox.authologic.com/oauth2/authorize
    device_authorization: https://sandbox.authologic.com/oauth2/device_authorization
