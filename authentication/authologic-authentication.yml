docs: https://developer.authologic.com/docs/technical/implementation
specification: API Commons Authentication
specificationVersion: '0.1'
provider: Authologic
providerId: authologic
description: >-
  Authologic offers two authentication styles over the same credential pair, and the published OAuth
  authorization server is materially richer than the OpenAPI lets on. The spec declares one
  clientCredentials flow; the RFC 8414 metadata document advertises five grant types, mTLS-bound tokens
  and DPoP.
summary:
  types:
    - http
    - oauth2
  oauth2_flows:
    - clientCredentials
  default_security: 'either scheme satisfies the requirement — security: [{apiKey: []}, {oauth2: []}]'
  applies_to: all 14 operations
  transport: HTTPS only
schemes:
  - name: apiKey
    type: http
    scheme: basic
    label: HTTP Basic
    description: >-
      Username is the account name; password is the environment-specific API key. This is the style every
      published example uses (`curl -u my_login`). The key is generated in the API Keys section of
      OmniPanel and is NOT the OmniPanel account password — the docs call the confusion out explicitly.
    credential_scope: per environment (a sandbox key does not work against production)
    issuance: https://omnipanel.authologic.com
    rotation: >-
      Self-serve — generate a new key in OmniPanel. No rotation policy or key lifetime is published, and
      no expiry is signalled at runtime.
    verified:
      probe: POST https://sandbox.authologic.com/api/conversations
      status: 401
      header: 'www-authenticate: Basic realm="Realm"'
      date: '2026-09-14'
    sources:
      - openapi/authologic-customer-api-openapi.yml
      - https://developer.authologic.com/docs/technical/implementation
  - name: oauth2
    type: oauth2
    label: OAuth 2.0 client credentials
    description: >-
      The same account name and API key are used as client_id and client_secret. POST to the token
      endpoint with Content-Type application/x-www-form-urlencoded and grant_type=client_credentials, then
      send Authorization: Bearer <token> on subsequent calls.
    flows:
      - flow: clientCredentials
        tokenUrl: https://sandbox.authologic.com/api/oauth2/token
        scopes: 0
        scopes_note: >-
          The scopes object is EMPTY in the contract and no scope taxonomy is published anywhere.
          Authorization is account- and environment-scoped, not scope-scoped. See
          scopes/authologic-scopes.yml.
    token_type: Bearer
    token_lifetime: not published
    sources:
      - openapi/authologic-customer-api-openapi.yml
authorization_server:
