  finding: >-
    A significant undocumented capability gap. The developer documentation describes Basic auth only and
    the OpenAPI declares only clientCredentials, yet the environment advertises authorization_code with
    PKCE, refresh tokens, the device grant, token exchange, private_key_jwt, mutual-TLS client
    authentication with certificate-bound access tokens (RFC 8705) and DPoP (RFC 9449). For an agent
    integrator that is the difference between a shared static secret and a cryptographically bound
    workload credential — and nothing in the docs mentions it is available.
webhook_authentication:
  direction: inbound (Authologic to integrator)
  scheme: HMAC-SHA-256
  headers:
    - X-Signature
    - X-Signature-Timestamp
  key: >-
    A dedicated signature key issued by Authologic, distinct from the API key. Replaced at go-live along
    with the API address and API key.
  replay_window_minutes: 5
  detail: asyncapi/authologic-callbacks-webhooks.yml
gaps:
  - No OpenID Connect discovery document (/.well-known/openid-configuration returns 404 on every host).
  - No /.well-known/oauth-protected-resource (RFC 9728), so an MCP-style client cannot discover the
    authorization server from the resource.
  - No published token lifetime, no key-rotation policy and no runtime expiry signal for API keys.
  - >-
    Production (api.authologic.com) adds an IP allowlist on top of credentials — an unlisted caller never
    reaches the auth layer and receives an nginx 403 HTML page instead of a JSON error.
