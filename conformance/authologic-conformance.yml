domain_standard:
  market: digital identity / eID / KYC-AML (EU)
  standards_in_market:
    - eIDAS 2.0 / EUDI Wallet
    - OpenID for Verifiable Credential Issuance
    - ISO/IEC 18013-5 (mdoc)
    - ETSI EN 319 401 / TS 119 471 / TS 119 472-1
  contract_signature: false
  finding: >-
    Authologic is a recognised eIDAS trust-service actor and says so in a formal published policy, but
    that conformance is NOT visible in the machine-readable contract. The OpenAPI contains zero
    occurrences of eIDAS, EUDI, eID, wallet, verifiable, OpenID, mdoc or ISO 18013; the verification
    methods it aggregates (mObywatel, BankID, SmartID, MobileID, SPID) are selected through an opaque
    free-text `strategy` string rather than a standardised identifier, and the attribute vocabulary is
    Authologic's own PERSON_* / COMPANY_* namespace rather than ETSI TS 119 472-1 attribute identifiers
    the policy says it may use. An integrator who already speaks eIDAS/OpenID4VCI still needs a bespoke
    connector for this API. Recorded as an honest negative on the contract signal, not as a conformance
    the contract does not carry.
