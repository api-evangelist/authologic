description: >-
  Standards and regulatory regimes Authologic conforms to, split by where the claim actually lives. Two
  very different bodies of evidence: a formally published eIDAS Trust Service Policy naming the ETSI and
  ISO norms Authologic operates under as a Trust Service Provider, and the protocol-level standards
  observable in the API surface itself.
