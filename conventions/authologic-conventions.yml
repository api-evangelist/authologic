generated: '2026-09-14'
method: searched
source: https://developer.authologic.com/docs/technical/implementation,
  https://developer.authologic.com/docs/integration/callbacks,
  https://developer.authologic.com/docs/technical/conversation-statuses,
  https://developer.authologic.com/docs/additional/conversation-expiration, and
