specification: API Commons Packages
specificationVersion: '0.1'
provider: Authologic
providerId: authologic
description: >-
  First-party client libraries published by Authologic. Two distinct families: a server-side Java SDK
  distributed on Maven Central under the com.authologic.client group (ten modular artifacts released in
  lockstep), and a browser WebSDK family on npm that embeds the hosted verification widget. Versions and
  publish dates below were read from the registries' own metadata endpoints on 2026-09-14.
notes:
  - The Java SDK docs page pins 0.2.42 in its Maven/Gradle snippets while Maven Central's
    maven-metadata.xml reports <release>0.2.46</release> (lastUpdated 20260824081911) — the documented
    version trails the published one by four releases.
  - The WebSDK npm packages have not been republished since 2025; @authologic/websdk-react last shipped
    2025-01-09. The docs continue to reference them as the current integration path.
  - The Angular WebSDK guide installs @authologic/websdk (the vanilla package); there is no
    @authologic/websdk-angular package on npm (registry returns 404).
