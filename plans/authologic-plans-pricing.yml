description: >-
  Authologic publishes no pricing. This artifact records that measured absence. It REPLACES a
  2026-05-04 bulk-sweep scaffold that asserted three invented tiers (Free 1,000 req/month, Professional
  100,000 req/month, Enterprise) with invented rate limits — none of which Authologic has ever published.
  That scaffold was fabrication and has been removed rather than carried forward.
plans: []
findings:
  - >-
    There is no pricing page. https://authologic.com/pricing and /pricing/ both return HTTP 404 (the
    site's soft-404 body, 85,093 bytes). "Pricing" appears in neither the homepage navigation nor
    https://authologic.com/sitemap.xml.
  - >-
    Neither llms.txt mentions pricing, plans, tiers or cost. The marketing llms.txt (last updated
    2026-09-12) enumerates every page on the site; pricing is not among them.
  - >-
    The developer portal has no pricing, billing or quota page across all 95 URLs in
    https://developer.authologic.com/sitemap.xml.
  - >-
    The commercial model is enterprise contact-led. The homepage's calls to action are a demo request
    (#demo) and OmniPanel signup; contact@authologic.com is the only commercial channel published.
  - >-
    The API does carry a plan concept even though the plans are not published: HTTP 402 is declared on
    all 14 operations as "Exhaustion of the plan or limitations related to non-payment". So accounts are
    metered against a plan — the plan's shape is simply not public.
access_model:
  model: contact-sales
  trial: unknown
  self_serve_signup: https://omnipanel.authologic.com/signup
  note: >-
    OmniPanel signup is open, which suggests some self-serve onboarding path exists, but no plan, quota
    or price is attached to it publicly. Recorded as unknown rather than guessed.
