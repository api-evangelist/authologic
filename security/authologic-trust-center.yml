description: >-
  Authologic does not run a conventional SaaS trust portal (no trust.authologic.com, no SOC 2 report
  room, no security.txt). What it publishes instead is an eIDAS trust-service repository: the policy,
  terms and status-list documents an EU Trust Service Provider is obliged to make public. That is a
  stronger and more specific disclosure than most vendor trust pages, and it is where the certification
  claims live.
