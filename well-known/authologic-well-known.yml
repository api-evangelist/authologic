specification: API Commons Well-Known
specificationVersion: '0.1'
provider: Authologic
providerId: authologic
description: >-
  Named-path /.well-known probe across every Authologic host. One real document was found: an RFC 8414
  OAuth 2.0 Authorization Server Metadata document served by the API environment at
  sandbox.authologic.com. No security.txt, no api-catalog, no ai-plugin, no agent card.
notes:
  - api.authologic.com is the production API host and is IP-allowlisted — every path returns 403 with an
    nginx "IP not allowed" page, so nothing there could be read from our network. That is a gated host,
    not an absent document.
  - id.authologic.com is a single-page app whose catch-all answers HTTP 200 with the same 568-byte HTML
    shell for every /.well-known/* path. Those 200s are NOT documents and are recorded as misses.
